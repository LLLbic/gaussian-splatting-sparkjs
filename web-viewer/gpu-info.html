<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU 信息检测</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            font-family: 'Consolas', 'Monaco', monospace;
            color: #e4e4e7;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        
        h1 {
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }
        
        .info-section {
            margin: 20px 0;
            padding: 20px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 10px;
            border-left: 4px solid #6366f1;
        }
        
        .info-section h2 {
            color: #06b6d4;
            margin-top: 0;
            font-size: 18px;
        }
        
        .info-item {
            margin: 10px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
        }
        
        .label {
            color: #a1a1aa;
            font-weight: bold;
        }
        
        .value {
            color: #06b6d4;
            margin-left: 10px;
        }
        
        .warning {
            background: rgba(239, 68, 68, 0.1);
            border-left-color: #ef4444;
            color: #fca5a5;
        }
        
        .success {
            background: rgba(34, 197, 94, 0.1);
            border-left-color: #22c55e;
            color: #86efac;
        }
        
        canvas {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 GPU 信息检测</h1>
        
        <div class="info-section">
            <h2>📊 WebGL 渲染器信息</h2>
            <div id="webgl-info"></div>
        </div>
        
        <div class="info-section">
            <h2>💻 系统GPU列表</h2>
            <div id="gpu-list"></div>
        </div>
        
        <div class="info-section">
            <h2>⚡ 性能建议</h2>
            <div id="recommendations"></div>
        </div>
    </div>
    
    <canvas id="canvas"></canvas>

    <script>
        // 获取WebGL信息
        function getWebGLInfo() {
            const canvas = document.getElementById('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            
            if (!gl) {
                return { error: 'WebGL 不支持' };
            }
            
            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            const info = {};
            
            if (debugInfo) {
                info.vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                info.renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
            } else {
                info.vendor = gl.getParameter(gl.VENDOR);
                info.renderer = gl.getParameter(gl.RENDERER);
            }
            
            info.version = gl.getParameter(gl.VERSION);
            info.shadingLanguageVersion = gl.getParameter(gl.SHADING_LANGUAGE_VERSION);
            info.maxTextureSize = gl.getParameter(gl.MAX_TEXTURE_SIZE);
            info.maxViewportDims = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
            
            return info;
        }
        
        // 显示WebGL信息
        const webglInfo = getWebGLInfo();
        const webglDiv = document.getElementById('webgl-info');
        
        if (webglInfo.error) {
            webglDiv.innerHTML = `<div class="info-item warning">${webglInfo.error}</div>`;
        } else {
            webglDiv.innerHTML = `
                <div class="info-item">
                    <span class="label">供应商:</span>
                    <span class="value">${webglInfo.vendor}</span>
                </div>
                <div class="info-item">
                    <span class="label">渲染器:</span>
                    <span class="value">${webglInfo.renderer}</span>
                </div>
                <div class="info-item">
                    <span class="label">WebGL版本:</span>
                    <span class="value">${webglInfo.version}</span>
                </div>
                <div class="info-item">
                    <span class="label">着色器语言:</span>
                    <span class="value">${webglInfo.shadingLanguageVersion}</span>
                </div>
                <div class="info-item">
                    <span class="label">最大纹理尺寸:</span>
                    <span class="value">${webglInfo.maxTextureSize}px</span>
                </div>
                <div class="info-item">
                    <span class="label">最大视口:</span>
                    <span class="value">${webglInfo.maxViewportDims[0]} x ${webglInfo.maxViewportDims[1]}</span>
                </div>
            `;
        }
        
        // 检测是否使用高性能GPU
        const gpuListDiv = document.getElementById('gpu-list');
        const recommendationsDiv = document.getElementById('recommendations');
        
        const isNvidia = webglInfo.renderer && (
            webglInfo.renderer.includes('NVIDIA') || 
            webglInfo.renderer.includes('GeForce') ||
            webglInfo.renderer.includes('RTX')
        );
        
        const isAMD = webglInfo.renderer && (
            webglInfo.renderer.includes('AMD') || 
            webglInfo.renderer.includes('Radeon')
        );
        
        gpuListDiv.innerHTML = `
            <div class="info-item">
                <span class="label">您的GPU配置:</span>
            </div>
            <div class="info-item">
                • NVIDIA GeForce RTX 4070 Laptop (高性能)
            </div>
            <div class="info-item">
                • AMD Radeon 610M (集成显卡)
            </div>
            <div class="info-item ${isNvidia ? 'success' : 'warning'}">
                <span class="label">当前使用:</span>
                <span class="value">${webglInfo.renderer || '未知'}</span>
            </div>
        `;
        
        if (isNvidia) {
            recommendationsDiv.innerHTML = `
                <div class="info-item success">
                    ✅ <strong>太好了！</strong> 浏览器正在使用您的高性能 NVIDIA RTX 4070 GPU
                </div>
                <div class="info-item">
                    💡 <strong>提示:</strong> 这是最佳配置，Gaussian Splatting 渲染性能已优化
                </div>
                <div class="info-item">
                    📌 <strong>注意:</strong> WebGL 无法同时使用多个GPU，但RTX 4070已足够强大
                </div>
            `;
        } else if (isAMD) {
            recommendationsDiv.innerHTML = `
                <div class="info-item warning">
                    ⚠️ <strong>警告:</strong> 浏览器正在使用集成显卡 (AMD Radeon 610M)
                </div>
                <div class="info-item">
                    💡 <strong>建议:</strong> 强制Chrome使用NVIDIA GPU以获得更好性能
                </div>
                <div class="info-item">
                    <strong>Windows设置步骤:</strong><br>
                    1. 右键桌面 → NVIDIA控制面板<br>
                    2. 管理3D设置 → 程序设置<br>
                    3. 添加 Chrome → 选择"高性能NVIDIA处理器"<br>
                    4. 重启Chrome
                </div>
            `;
        } else {
            recommendationsDiv.innerHTML = `
                <div class="info-item">
                    ℹ️ 无法确定当前GPU类型
                </div>
            `;
        }
        
        console.log('WebGL Info:', webglInfo);
    </script>
</body>
</html>
