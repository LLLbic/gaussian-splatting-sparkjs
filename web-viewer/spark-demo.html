<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark Gaussian Splatting Demo - Lethe River</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            font-family: 'Inter', sans-serif;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            max-width: 300px;
        }
        
        .info h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .info p {
            margin: 5px 0;
            font-size: 14px;
            color: #a1a1aa;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            text-align: center;
        }
        
        .spinner {
            border: 4px solid rgba(99, 102, 241, 0.3);
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="info">
        <h1>🌟 Spark Demo</h1>
        <p><strong>Lethe River</strong></p>
        <p>World Labs Gaussian Splatting</p>
        <p>🎨 高性能点云渲染</p>
        <p>🔄 拖动旋转 | 滚轮缩放</p>
    </div>
    
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>加载 Gaussian Splat...</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.178.0/three.module.js",
            "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/0.1.10/spark.module.js"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from "three";
        import { SplatMesh } from "@sparkjsdev/spark";
        import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/controls/OrbitControls.js";

        // 创建场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f);
        
        // 创建相机
        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 0, 5);
        
        // 创建渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);
        
        // 添加控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // 添加环境光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        // 添加方向光
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);
        
        // 加载 Gaussian Splat
        // 使用 Spark 官方示例的蝴蝶模型
        const splatURL = "https://sparkjs.dev/assets/splats/butterfly.spz";
        
        console.log("开始加载 Gaussian Splat:", splatURL);
        
        const butterfly = new SplatMesh({ url: splatURL });
        
        // 调整蝴蝶的位置和旋转
        butterfly.quaternion.set(1, 0, 0, 0);
        butterfly.position.set(0, 0, 0);
        butterfly.scale.set(1, 1, 1);
        
        scene.add(butterfly);
        
        // 加载状态跟踪
        let loadingHidden = false;
        
        function hideLoading() {
            if (!loadingHidden) {
                console.log("隐藏加载提示");
                document.getElementById('loading').style.display = 'none';
                loadingHidden = true;
            }
        }
        
        // 监听加载完成 - 方法1: load 事件
        butterfly.addEventListener('load', () => {
            console.log("Gaussian Splat 加载完成！(load event)");
            hideLoading();
        });
        
        // 方法2: 检查 isLoaded 属性
        const checkLoaded = setInterval(() => {
            if (butterfly.isLoaded) {
                console.log("Gaussian Splat 加载完成！(isLoaded check)");
                hideLoading();
                clearInterval(checkLoaded);
            }
        }, 100);
        
        // 方法3: 超时保护 - 10秒后强制隐藏
        setTimeout(() => {
            console.log("超时保护：强制隐藏加载提示");
            hideLoading();
            clearInterval(checkLoaded);
        }, 10000);
        
        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 更新控制器
            controls.update();
            
            // 缓慢旋转蝴蝶
            butterfly.rotation.y += 0.005;
            
            // 渲染场景
            renderer.render(scene, camera);
        }
        
        animate();
        
        console.log("Spark Demo 初始化完成");
        console.log("THREE.js 版本:", THREE.REVISION);
    </script>
</body>
</html>
