<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>3D Demo Test</title>
    <style>
        body {
            margin: 0;
            background: #0a0a0f;
            color: white;
            font-family: Arial, sans-serif;
        }
        #demo-container {
            width: 600px;
            height: 400px;
            margin: 50px auto;
            border: 2px solid #6366f1;
            border-radius: 10px;
            overflow: hidden;
        }
        h1 {
            text-align: center;
            color: #6366f1;
        }
        .info {
            text-align: center;
            margin: 20px;
            color: #a1a1aa;
        }
    </style>
</head>
<body>
    <h1>3D Tutorial Demo Test</h1>
    <div class="info">Testing Three.js camera orbit demonstration</div>
    <div id="demo-container"></div>

    <!-- 使用 cdnjs THREE.js r180 -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.min.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        
        // 将 THREE 和 GLTFLoader 暴露到全局作用域
        window.THREE = THREE;
        window.GLTFLoader = GLTFLoader;
        
        console.log('THREE.js r180 loaded from cdnjs:', THREE.REVISION);
        console.log('GLTFLoader available:', typeof GLTFLoader);
        
        // 初始化演示
        function initDemo() {
            console.log('Initializing 3D demo...');
            
            // 动态加载 tutorial-demo.js
            const script = document.createElement('script');
            script.src = 'js/tutorial-demo.js';
            script.onload = function() {
                console.log('tutorial-demo.js loaded');
                tutorialDemo.init('demo-container');
            };
            script.onerror = function() {
                console.error('Failed to load tutorial-demo.js');
            };
            document.body.appendChild(script);
        }
        
        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initDemo);
        } else {
            initDemo();
        }
    </script>
</body>
</html>
