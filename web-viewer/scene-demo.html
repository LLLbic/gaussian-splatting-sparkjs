<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene Particle Rendering - Lethe River</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Inter', sans-serif;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            max-width: 350px;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        
        .info h1 {
            margin: 0 0 15px 0;
            font-size: 28px;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .info p {
            margin: 8px 0;
            font-size: 14px;
            color: #e4e4e7;
            line-height: 1.6;
        }
        
        .info .controls-hint {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(99, 102, 241, 0.3);
            font-size: 12px;
            color: #a1a1aa;
        }
        
        .info .controls-hint kbd {
            display: inline-block;
            padding: 2px 6px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 3px;
            font-family: monospace;
            color: #06b6d4;
            margin: 0 2px;
        }
        
        .info .highlight {
            color: #06b6d4;
            font-weight: 500;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid rgba(99, 102, 241, 0.5);
        }
        
        .spinner {
            border: 4px solid rgba(99, 102, 241, 0.3);
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
        }
        
        .btn {
            padding: 12px 24px;
            background: rgba(99, 102, 241, 0.9);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }
        
        .btn:hover {
            background: rgba(99, 102, 241, 1);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.5);
        }
    </style>
</head>
<body>
    <div class="info">
        <h1>🏠 场景粒子渲染</h1>
        <p><strong>Lethe River</strong> × World Labs Spark</p>
        <p class="highlight">✨ Gaussian Splatting 技术</p>
        <p>📍 场景：彩色卧室</p>
        <p>🎨 数百万粒子构建完整场景</p>
        <p>🔄 拖动旋转 | 滚轮缩放</p>
        <div class="controls-hint">
            <strong>⌨️ 键盘控制：</strong><br>
            <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 前后左右移动<br>
            <kbd>Q</kbd><kbd>E</kbd> 上下移动<br>
            <kbd>Shift</kbd> 加速移动
        </div>
    </div>
    
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>加载场景粒子...</div>
        <div style="font-size: 14px; color: #a1a1aa; margin-top: 10px;">
            数百万个 Gaussian Splat 点
        </div>
    </div>
    
    <div class="controls" id="controls" style="display: none;">
        <button class="btn" onclick="changeScene('bedroom')">🛏️ 卧室</button>
        <button class="btn" onclick="changeScene('fireplace')">🔥 壁炉</button>
        <button class="btn" onclick="changeScene('valley')">🏔️ 山谷</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.178.0/three.module.js",
            "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/0.1.10/spark.module.js"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from "three";
        import { SplatMesh } from "@sparkjsdev/spark";
        import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/controls/OrbitControls.js";

        // 场景配置
        const scenes = {
            bedroom: {
                url: "https://storage.googleapis.com/forge-dev-public/painted_bedroom.spz",
                name: "彩色卧室",
                camera: { x: 0, y: 0.8, z: 0 }, // 在房间中央，视线高度
                lookAt: { x: 1, y: 0.8, z: 0 }  // 看向房间一侧
            },
            fireplace: {
                url: "https://sparkjs.dev/assets/splats/fireplace.spz",
                name: "壁炉",
                camera: { x: 0, y: 0.5, z: 0 },
                lookAt: { x: 0, y: 0.5, z: -2 }
            },
            valley: {
                url: "https://sparkjs.dev/assets/splats/valley.spz",
                name: "山谷",
                camera: { x: 0, y: 1, z: 0 },
                lookAt: { x: 3, y: 1, z: -3 }
            }
        };

        let currentSplat = null;
        let currentScene = 'bedroom';

        // 创建场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        
        // 创建相机
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        
        // 创建渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);
        
        // 添加控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 1;
        controls.maxDistance = 20;
        
        // 添加环境光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);
        
        // 加载场景函数
        function loadScene(sceneKey) {
            const sceneConfig = scenes[sceneKey];
            console.log("加载场景:", sceneConfig.name);
            
            // 移除旧场景
            if (currentSplat) {
                scene.remove(currentSplat);
                currentSplat = null;
            }
            
            // 显示加载提示
            document.getElementById('loading').style.display = 'block';
            
            // 加载新场景
            const splat = new SplatMesh({ url: sceneConfig.url });
            
            // 修正场景方向 - 绕X轴旋转180度
            splat.rotation.x = Math.PI;
            
            // 设置相机位置（在场景内部）
            camera.position.set(
                sceneConfig.camera.x,
                sceneConfig.camera.y,
                sceneConfig.camera.z
            );
            
            // 设置观察目标
            if (sceneConfig.lookAt) {
                controls.target.set(
                    sceneConfig.lookAt.x,
                    sceneConfig.lookAt.y,
                    sceneConfig.lookAt.z
                );
            } else {
                controls.target.set(0, 0, 0);
            }
            
            controls.update();
            
            scene.add(splat);
            currentSplat = splat;
            currentScene = sceneKey;
            
            // 渐进式渲染效果
            let revealProgress = 0;
            let isRevealing = false;
            
            // 加载状态跟踪
            let loadingHidden = false;
            
            function hideLoading() {
                if (!loadingHidden) {
                    console.log("场景加载完成，开始渐进式渲染:", sceneConfig.name);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('controls').style.display = 'flex';
                    loadingHidden = true;
                    
                    // 开始渐进式显示
                    isRevealing = true;
                    revealProgress = 0;
                    
                    // 初始设置为完全透明
                    if (splat.material && splat.material.uniforms) {
                        if (!splat.material.uniforms.opacity) {
                            splat.material.uniforms.opacity = { value: 0 };
                        }
                        splat.material.transparent = true;
                    }
                }
            }
            
            // 渐进式渲染动画
            function updateReveal() {
                if (isRevealing && currentSplat) {
                    revealProgress += 0.01; // 控制渐进速度
                    
                    if (revealProgress >= 1) {
                        revealProgress = 1;
                        isRevealing = false;
                    }
                    
                    // 更新透明度
                    if (currentSplat.material && currentSplat.material.uniforms) {
                        if (currentSplat.material.uniforms.opacity) {
                            currentSplat.material.uniforms.opacity.value = revealProgress;
                        }
                    }
                    
                    // 也可以通过缩放创建"粒子聚集"效果
                    const scale = 0.8 + (revealProgress * 0.2);
                    currentSplat.scale.set(scale, scale, scale);
                }
            }
            
            // 将更新函数添加到动画循环
            const originalAnimate = window.animateFunc;
            window.animateFunc = function() {
                updateReveal();
                if (originalAnimate) originalAnimate();
            };
            
            // 监听加载完成
            splat.addEventListener('load', () => {
                console.log("Gaussian Splat 加载完成！");
                hideLoading();
            });
            
            // 轮询检查
            const checkLoaded = setInterval(() => {
                if (splat.isLoaded) {
                    hideLoading();
                    clearInterval(checkLoaded);
                }
            }, 100);
            
            // 超时保护
            setTimeout(() => {
                hideLoading();
                clearInterval(checkLoaded);
            }, 15000);
        }
        
        // 切换场景
        window.changeScene = function(sceneKey) {
            if (sceneKey !== currentScene) {
                loadScene(sceneKey);
            }
        };
        
        // 初始加载
        loadScene('bedroom');
        
        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 键盘控制
        const keyboard = {
            w: false, a: false, s: false, d: false,
            q: false, e: false, shift: false
        };
        
        const moveSpeed = 0.05;
        const fastMoveSpeed = 0.15;
        
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keyboard.w = true;
            if (key === 'a') keyboard.a = true;
            if (key === 's') keyboard.s = true;
            if (key === 'd') keyboard.d = true;
            if (key === 'q') keyboard.q = true;
            if (key === 'e') keyboard.e = true;
            if (e.shiftKey) keyboard.shift = true;
        });
        
        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keyboard.w = false;
            if (key === 'a') keyboard.a = false;
            if (key === 's') keyboard.s = false;
            if (key === 'd') keyboard.d = false;
            if (key === 'q') keyboard.q = false;
            if (key === 'e') keyboard.e = false;
            if (!e.shiftKey) keyboard.shift = false;
        });
        
        function updateCameraMovement() {
            const speed = keyboard.shift ? fastMoveSpeed : moveSpeed;
            
            // 获取相机的前后左右方向
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0; // 保持水平移动
            forward.normalize();
            
            const right = new THREE.Vector3();
            right.crossVectors(forward, new THREE.Vector3(0, 1, 0));
            right.normalize();
            
            // WASD 移动
            if (keyboard.w) {
                camera.position.addScaledVector(forward, speed);
                controls.target.addScaledVector(forward, speed);
            }
            if (keyboard.s) {
                camera.position.addScaledVector(forward, -speed);
                controls.target.addScaledVector(forward, -speed);
            }
            if (keyboard.a) {
                camera.position.addScaledVector(right, -speed);
                controls.target.addScaledVector(right, -speed);
            }
            if (keyboard.d) {
                camera.position.addScaledVector(right, speed);
                controls.target.addScaledVector(right, speed);
            }
            
            // QE 上下移动
            if (keyboard.q) {
                camera.position.y -= speed;
                controls.target.y -= speed;
            }
            if (keyboard.e) {
                camera.position.y += speed;
                controls.target.y += speed;
            }
        }
        
        // 动画循环
        window.animateFunc = null;
        
        function animate() {
            requestAnimationFrame(animate);
            
            // 更新键盘控制的相机移动
            updateCameraMovement();
            
            controls.update();
            
            // 执行渐进式渲染更新
            if (window.animateFunc) {
                window.animateFunc();
            }
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        console.log("场景粒子渲染演示初始化完成");
        console.log("THREE.js 版本:", THREE.REVISION);
    </script>
</body>
</html>
